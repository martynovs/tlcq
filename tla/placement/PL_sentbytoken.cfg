\* Bug variant: a `sent?` record refreshed by its commit's token instead of the id, so a lost attach ends the record `never sent` while the VM runs the job, and a later offline command runs it on the laptop too; must fail NoTwoPlaces.
CONSTANTS
  Ids = {a, b}
  Cmds = {c1, c2, c3}
  Wts = {w1, w2}
  NoOne = NoOne
  MaxOutages = 1
  MaxCancels = 0
  HandoffGap = FALSE
  AttachByRecord = FALSE
  StaleOffline = FALSE
  NoWriteAhead = FALSE
  SupersedeAfterCommit = FALSE
  NoPendingInScan = FALSE
  SupersedeAll = FALSE
  FlushLate = FALSE
  NoOwnEntry = FALSE
  AttachExempt = FALSE
  KeepPending = FALSE
  SentByToken = TRUE
SPECIFICATION Spec
SYMMETRY Symm
INVARIANTS TypeOK NoTwoPlaces OrphanSound OneVersion WaitersRespected
