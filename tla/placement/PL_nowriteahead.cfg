  Wts = {w1, w2}
  NoOne = NoOne
  MaxOutages = 1
  MaxCancels = 0
  HandoffGap = FALSE
  AttachByRecord = FALSE
  StaleOffline = FALSE
  NoWriteAhead = TRUE
  SupersedeAfterCommit = FALSE
  NoPendingInScan = FALSE
  SupersedeAll = FALSE
  FlushLate = FALSE
  NoOwnEntry = FALSE
  AttachExempt = FALSE
  KeepPending = FALSE
  SentByToken = FALSE
SPECIFICATION Spec
