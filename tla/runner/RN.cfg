\* The runner as designed: two ids, one run each, two attempt numbers (a pause, then its resume), two crashes, two cancels or supersedes, two page actions; every property holds.
CONSTANTS
  Ids = {a, b}
  MaxRuns = 1
  MaxCommits = 2
  MaxAttempts = 2
  MaxCrashes = 2
  MaxCancels = 2
  MaxUi = 2
  NeverStarted = 2
  StartFails = TRUE
  UndoOverCancel = FALSE
  ReuseAttempt = FALSE
  NoLimit = FALSE
  StopBeforeMark = FALSE
  NoUndoOnFail = FALSE
  NoStartedMarker = FALSE
  PausedOverCancel = FALSE
  ResettleEnded = FALSE
  PauseByRequest = FALSE
  NoCkCheck = FALSE
  ThawedFree = FALSE
  KeepAfterMark = FALSE
  NoKeepOnDeath = FALSE
  PreflightUnlocked = FALSE
  NoSettle = FALSE
  Whole = {}
  WholeNoWait = FALSE
SPECIFICATION Spec
SYMMETRY Symm
INVARIANTS TypeOK OneLiveAttempt SlotsExclusive ClosedSlot PausingNotFrozen PausedHasCheckpoint PausedAsked CheckpointNotLost
           CancelFinal NoStuckRun SettleTwiceNoop ErrorOnlyAfterCrash NoNameClash UndoLimit WholeAlone
PROPERTY PreflightTrue PausedStays
